<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Мета-тег viewport обязателен, чтобы сайт не масштабировался и не дергался на смартфонах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Нарды на Babylon.js</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            /* Отключаем стандартные жесты браузера (скролл, зум лупой), чтобы они не мешали игре */
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <!-- Подключение библиотеки -->
    <script src="babylon.js"></script>

</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);

            // 1. Камера — ArcRotateCamera идеально подходит для мобилок (поворот двумя пальцами, зум щипком)
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 20, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 10;
            camera.upperRadiusLimit = 25;
            camera.upperBetaLimit = Math.PI / 2.2; // Ограничиваем камеру, чтобы нельзя было заглянуть под стол

            // 2. Освещение
            const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.6;

            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(10, 20, 10);
            dirLight.intensity = 0.5;

            // 3. Материалы
            const boardMaterial = new BABYLON.StandardMaterial("boardMat", scene);
            boardMaterial.diffuseColor = new BABYLON.Color3(0.45, 0.25, 0.12);

            const whiteMat = new BABYLON.StandardMaterial("whiteMat", scene);
            whiteMat.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.85);

            const blackMat = new BABYLON.StandardMaterial("blackMat", scene);
            blackMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.15);

            // 4. Игровое поле
            const board = BABYLON.MeshBuilder.CreateBox("board", { width: 12, height: 0.5, depth: 14 }, scene);
            board.material = boardMaterial;

            const bar = BABYLON.MeshBuilder.CreateBox("bar", { width: 0.8, height: 0.7, depth: 14 }, scene);
            bar.position.y = 0.1;
            bar.material = boardMaterial;

            // 5. Автоматическая расстановка всех 30 шашек по классическим правилам (Короткие нарды)
            const checkers = [];
            
            function spawnStack(count, x, z, material, team, direction) {
                for (let i = 0; i < count; i++) {
                    const name = `${team === 1 ? "white" : "black"}_x${x}_z${z}_${i}`;
                    const checker = BABYLON.MeshBuilder.CreateCylinder(name, { diameter: 0.8, height: 0.3, tessellation: 24 }, scene);
                    
                    // Выстраиваем шашки в ряд (вдоль оси Z). direction регулирует, идут они вверх или вниз поля
                    checker.position = new BABYLON.Vector3(x, 0.4, z + (i * 0.9 * direction));
                    checker.material = material;
                    checker.metadata = { team: team, isChecker: true };
                    checkers.push(checker);
                }
            }

            // Координаты лунок по осям X и Z (учитывая перегородку-бар)
            // Левая половина: X = -4.5, Правая половина: X = 4.5. Промежуточные лунки смещаются к центру.
            const xCoords = [-5.2, -4.3, -3.4, -2.5, -1.6, -0.7,  0.7, 1.6, 2.5, 3.4, 4.3, 5.2];

            // Расстановка Белых (Team 1)
            spawnStack(2,  xCoords[0],  -5.8, whiteMat, 1,  1);  // 1 пункт (2 шашки)
            spawnStack(5,  xCoords[11], -5.8, whiteMat, 1,  1);  // 12 пункт (5 шашек)
            spawnStack(3,  xCoords[4],   5.8, whiteMat, 1, -1);  // 17 пункт (3 шашки)
            spawnStack(5,  xCoords[6],   5.8, whiteMat, 1, -1);  // 19 пункт (5 шашек)

            // Расстановка Черных (Team 2)
            spawnStack(2,  xCoords[0],   5.8, blackMat, 2, -1);  // 24 пункт (2 шашки)
            spawnStack(5,  xCoords[11],  5.8, blackMat, 2, -1);  // 13 пункт (5 шашек)
            spawnStack(3,  xCoords[4],  -5.8, blackMat, 2,  1);  // 8 пункт (3 шашки)
            spawnStack(5,  xCoords[6],  -5.8, blackMat, 2,  1);  // 6 пункт (5 шашек)

            // 6. Логика тач-управления и кликов
            let selectedChecker = null;

            // Используем onPointerDown — Babylon.js автоматически трансформирует клики мыши и тапы пальцем в единое событие
            scene.onPointerDown = function (evt, pickResult) {
                if (pickResult.hit) {
                    const mesh = pickResult.pickedMesh;

                    // Шаг 1: Выбор шашки (работает и от тапа, и от клика)
                    if (mesh.metadata && mesh.metadata.isChecker) {
                        if (selectedChecker) {
                            selectedChecker.renderOutline = false;
                        }
                        
                        selectedChecker = mesh;
                        selectedChecker.outlineColor = BABYLON.Color3.Green();
                        selectedChecker.outlineWidth = 0.04;
                        selectedChecker.renderOutline = true;
                    } 
                    // Шаг 2: Перемещение выбранной шашки на доску в точку нажатия
                    else if (selectedChecker && (mesh === board || mesh === bar)) {
                        const targetPoint = pickResult.pickedPoint;
                        
                        // Плавная анимация перемещения (отлично смотрится на мобильных телефонах)
                        BABYLON.Animation.CreateAndStartAnimation(
                            "moveAnim", selectedChecker, "position", 60, 12, 
                            selectedChecker.position, 
                            new BABYLON.Vector3(targetPoint.x, 0.4, targetPoint.z),
                            BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT
                        );

                        selectedChecker.renderOutline = false;
                        selectedChecker = null;
                    }
                }
            };

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
