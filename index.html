<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нарды на Babylon.js</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #111;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }
        #error-msg {
            position: absolute;
            top: 10px;
            left: 10px;
            color: red;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            font-family: sans-serif;
            display: none;
            z-index: 100;
        }
    </style>
    <!-- Используем зеркало cdnjs для надежности -->
   <script src="babylon.js"></script>


</head>
<body>
    <div id="error-msg"></div>
    <canvas id="renderCanvas"></canvas>

    <script>
        // Функция для вывода ошибок на экран
        function showError(text) {
            const el = document.getElementById("error-msg");
            el.style.display = "block";
            el.innerHTML += text + "<br>";
        }

        // Проверяем, загрузился ли Babylon
        if (typeof BABYLON === 'undefined') {
            showError("Ошибка: Библиотека Babylon.js не загрузилась. Проверьте подключение к интернету или замените ссылку на скрипт.");
        } else {
            const canvas = document.getElementById("renderCanvas");
            
            // Проверяем поддержку WebGL
            if (!BABYLON.Engine.isSupported()) {
                showError("Ошибка: Ваш браузер не поддерживает WebGL.");
            } else {
                try {
                    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

                    const createScene = function () {
                        const scene = new BABYLON.Scene(engine);
                        scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);

                        // Камера
                        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 20, BABYLON.Vector3.Zero(), scene);
                        camera.attachControl(canvas, true);

                        // Свет
                        const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
                        hemiLight.intensity = 0.7;

                        // Материал доски
                        const boardMaterial = new BABYLON.StandardMaterial("boardMat", scene);
                        boardMaterial.diffuseColor = new BABYLON.Color3(0.5, 0.25, 0.1);

                        // Доска
                        const board = BABYLON.MeshBuilder.CreateBox("board", { width: 12, height: 0.5, depth: 14 }, scene);
                        board.material = boardMaterial;

                        // Тестовая шашка (белая)
                        const whiteMat = new BABYLON.StandardMaterial("whiteMat", scene);
                        whiteMat.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.9);
                        
                        const checker = BABYLON.MeshBuilder.CreateCylinder("checker", { diameter: 0.8, height: 0.3 }, scene);
                        checker.position = new BABYLON.Vector3(-3, 0.4, -3);
                        checker.material = whiteMat;

                        return scene;
                    };

                    const scene = createScene();

                    engine.runRenderLoop(function () {
                        scene.render();
                    });

                    window.addEventListener("resize", function () {
                        engine.resize();
                    });

                } catch (e) {
                    showError("Критическая ошибка при инициализации сцены: " + e.message);
                }
            }
        }
    </script>
</body>
</html>
